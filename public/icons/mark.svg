<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="78%">
      <stop offset="0%" stop-color="#0b0e16"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- attention: the scope / lens ring you look through -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#2ce6ff" stroke-opacity="0.55" stroke-width="8"/>

  <!-- intention: crosshair ticks aiming at the center -->
  <g stroke="#e9ecf6" stroke-width="9" stroke-linecap="round">
    <line x1="256" y1="84" x2="256" y2="150"/>
    <line x1="256" y1="362" x2="256" y2="428"/>
    <line x1="84" y1="256" x2="150" y2="256"/>
    <line x1="362" y1="256" x2="428" y2="256"/>
  </g>

  <!-- inner lock ring -->
  <circle cx="256" cy="256" r="80" fill="none" stroke="#ff5e1a" stroke-width="7"/>

  <!-- the point of focus -->
  <circle cx="256" cy="256" r="48" fill="#ff5e1a" opacity="0.4" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="23" fill="#ff5e1a"/>
  <circle cx="256" cy="256" r="9" fill="#ffe2d2"/>
</svg>
